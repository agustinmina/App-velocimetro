<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Velocímetro Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="hud-container">
        <svg class="progress-ring" width="230" height="230">
            <circle class="progress-ring__circle-bg" stroke="rgba(255,255,255,0.05)" stroke-width="10" fill="transparent" r="100" cx="115" cy="115"/>
            <circle class="progress-ring__circle" stroke="#00ff00" stroke-width="10" fill="transparent" r="100" cx="115" cy="115"/>
        </svg>
        
        <div class="speed-data">
            <div id="speed">0</div>
            <div class="unit">KM/H</div>
        </div>
    </div>
    
    <!-- Panel de Odómetros -->
    <div class="odometer-panel">
        <div class="odo-box">
            <span class="odo-label">VIAJE</span>
            <span id="trip-dist">0.00</span> <span class="odo-unit">km</span>
        </div>
        <div class="odo-box">
            <span class="odo-label">TOTAL</span>
            <span id="total-dist">0.00</span> <span class="odo-unit">km</span>
        </div>
    </div>

    <div id="status">INICIANDO SISTEMA...</div>

    <script src="cordova.js"></script>
    <script src="app.js"></script>
</body>
</html>
