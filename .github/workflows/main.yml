name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar Cordova
        run: npm install -g cordova

      - name: Compilar proyecto
        run: |
          cordova create app com.velocimetro.moto VelocimetroMoto
          rm -rf app/www/*
          cp index.html style.css app.js app/www/
          cd app
          cordova plugin add cordova-plugin-geolocation
          cordova plugin add cordova-plugin-android-permissions
          cordova plugin add cordova-plugin-background-mode
          cordova plugin add cordova-plugin-insomnia
          cordova platform add android
          cordova build android

      - name: Subir el APK terminado
        uses: actions/upload-artifact@v4
        with:
          name: Velocimetro-APK
          path: app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
          
